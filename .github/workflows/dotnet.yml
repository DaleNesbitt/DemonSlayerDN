name: .NET Build & Test

# Basic permissions needed for pulling code and uploading artifacts
permissions:
  contents: read

on:
  # Run CI on pushes to main
  push:
    branches: [ main ]
  # Run CI on pull requests into main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code so the runner has access to the repo files
      - uses: actions/checkout@v3

      # Install .NET 8 so the runner can build and test the project
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # Restore dependencies for the ENTIRE solution (src + tests)
      # Using the .sln here guarantees both projects restore correctly.
      - name: Restore dependencies
        run: dotnet restore DemonSlayerSolution.sln

      # Build the whole solution. This makes sure BOTH the main project AND
      # the test project are compiled before we try to run tests.
      - name: Build solution
        run: dotnet build DemonSlayerSolution.sln --configuration Release --no-restore

      # Run all tests in the test project and collect coverage.
      # We point directly at the test .csproj to avoid any weird solution-level
      # discovery issues we were hitting before.
      - name: Run tests with coverage
        run: dotnet test tests/DemonSlayer.Tests/DemonSlayer.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"

      # Upload the code coverage file so it appears in Actions artifacts.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

      # Upload generated XML documentation (autodoc) as an artifact.
      # This proves documentation is generated automatically by the build.
      - name: Upload XML documentation
        uses: actions/upload-artifact@v4
        with:
          name: xml-docs
          path: '**/*.xml'
